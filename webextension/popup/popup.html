<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 200px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    .status {
      margin-bottom: 10px;
      font-weight: bold;
    }
    .status.on { color: #2a7d2a; }
    .status.off { color: #c0392b; }
    button {
      width: 100%;
      padding: 6px;
      margin-bottom: 6px;
      border: 1px solid #aaa;
      border-radius: 3px;
      background: #fff;
      cursor: pointer;
    }
    button:hover { background: #e8e8e8; }
  </style>
</head>
<body>
  <div class="status" id="status">OFF</div>
  <button id="toggle">Toggle ON/OFF</button>
  <button id="open-sidebar">Open Sidebar</button>
  <script src="popup.js"></script>
</body>
</html>
