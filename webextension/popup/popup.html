<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .header img {
      width: 24px;
      height: 24px;
    }
    .header h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 600;
    }
    .status {
      margin-bottom: 12px;
      padding: 6px 10px;
      border-radius: 4px;
      font-weight: bold;
      text-align: center;
    }
    .status.on { background: #d4edda; color: #155724; }
    .status.off { background: #f8d7da; color: #721c24; }
    button {
      width: 100%;
      padding: 7px;
      margin-bottom: 6px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #f0f0f0; }
    button:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="header">
    <img src="../icons/Crocodile_48.png" alt="">    <h1>Header Tool</h1>
  </div>
  <div class="status off" id="status">OFF</div>
  <button id="toggle">Toggle ON / OFF</button>
  <button id="open-sidebar">Open Sidebar (F4)</button>
  <script src="popup.js"></script>
</body>
</html>
